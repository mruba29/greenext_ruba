<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="gn-fav-grad" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="gn-fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#00FF66" flood-opacity="0.75"/>
    </filter>
  </defs>
  <!-- Midnight Navy high-contrast badge for browser tabs -->
  <rect width="32" height="32" rx="8" fill="#0B1220"/>
  <!-- Subtle inner border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#00FF66" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Glowing Electric Green Leaf Contour -->
  <path d="M7 25 C5.5 19 7 12 12 7 C16.5 3 21.5 3 26 4.5 C26.5 9 26.5 14.5 22.5 19 C17.5 24.5 12 26 7 25 Z"
        fill="rgba(0, 255, 102, 0.16)"
        stroke="url(#gn-fav-grad)"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#gn-fav-glow)"/>
  <!-- Central data spine -->
  <path d="M7 25 C11 21.5 15.5 16.5 21 9"
        stroke="url(#gn-fav-grad)"
        stroke-width="1.5"
        stroke-linecap="round"/>
  <!-- Cyber branch veins & terminal nodes -->
  <path d="M15 15 L21 13" stroke="#00FF66" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="21" cy="13" r="1.2" fill="#FFFFFF"/>
  <path d="M12.5 18.5 L8.5 16" stroke="#00FF66" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8.5" cy="16" r="1.2" fill="#FFFFFF"/>
  <!-- Glowing apex node -->
  <circle cx="26" cy="4.5" r="1.2" fill="#FFFFFF"/>
  <!-- Base stem -->
  <path d="M7 25 C5.5 27 4.5 28 3.5 29" stroke="url(#gn-fav-grad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
