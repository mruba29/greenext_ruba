<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gn-badge-grad" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="gn-badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00FF66" flood-opacity="0.65"/>
    </filter>
  </defs>
  <!-- Midnight Navy high-contrast badge rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0B1220"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#00FF66" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Glowing Electric Green Leaf Contour -->
  <path d="M14 50 C11 38 14 24 24 14 C33 6 43 6 52 9 C53 18 53 29 45 38 C35 49 24 52 14 50 Z"
        fill="rgba(0, 255, 102, 0.15)"
        stroke="url(#gn-badge-grad)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#gn-badge-glow)"/>
  <!-- Central circuit spine -->
  <path d="M14 50 C22 43 31 33 42 18"
        stroke="url(#gn-badge-grad)"
        stroke-width="2.5"
        stroke-linecap="round"/>
  <!-- Branch veins & terminal nodes -->
  <path d="M30 30 L42 26" stroke="#00FF66" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="26" r="2.2" fill="#FFFFFF" stroke="#00FF66" stroke-width="1"/>
  <path d="M25 37 L17 32" stroke="#00FF66" stroke-width="2" stroke-linecap="round"/>
  <circle cx="17" cy="32" r="2.2" fill="#FFFFFF" stroke="#00FF66" stroke-width="1"/>
  <path d="M19 44 L29 43" stroke="#00FF66" stroke-width="2" stroke-linecap="round"/>
  <circle cx="29" cy="43" r="2" fill="#FFFFFF" stroke="#00FF66" stroke-width="1"/>
  <!-- Glowing apex node -->
  <circle cx="52" cy="9" r="2.4" fill="#FFFFFF" stroke="#39FF14" stroke-width="1"/>
  <!-- Base stem -->
  <path d="M14 50 C10 54 8 57 6 59" stroke="url(#gn-badge-grad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
