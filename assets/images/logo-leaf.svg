<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="gn-leaf-grad" x1="4" y1="32" x2="32" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="gn-leaf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#00FF66" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Outer glowing leaf outline (transparent background) -->
  <path d="M7 29 C4.5 21 6.5 12 13 6 C18 1.5 25 1.5 31 3 C31.5 9 31.5 16 26.5 22.5 C20.5 29 13.5 30.5 7 29 Z"
        fill="rgba(0, 255, 102, 0.10)"
        stroke="url(#gn-leaf-grad)"
        stroke-width="2.1"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#gn-leaf-glow)"/>
  <!-- Central circuit spine -->
  <path d="M7 29 C12 25 18 19 24.5 10"
        stroke="url(#gn-leaf-grad)"
        stroke-width="1.8"
        stroke-linecap="round"
        filter="url(#gn-leaf-glow)"/>
  <!-- Branch veins & terminal nodes -->
  <path d="M18 17 L25.5 14" stroke="#00FF66" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="25.5" cy="14" r="1.4" fill="#FFFFFF" stroke="#00FF66" stroke-width="0.8"/>
  <path d="M14 21 L8.5 18" stroke="#00FF66" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="8.5" cy="18" r="1.4" fill="#FFFFFF" stroke="#00FF66" stroke-width="0.8"/>
  <path d="M10.5 25.5 L17 24.5" stroke="#00FF66" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="17" cy="24.5" r="1.2" fill="#FFFFFF" stroke="#00FF66" stroke-width="0.8"/>
  <circle cx="31" cy="3" r="1.4" fill="#FFFFFF" stroke="#39FF14" stroke-width="0.8"/>
  <!-- Base stem -->
  <path d="M7 29 C5 31.5 3.5 33 2.5 34" stroke="url(#gn-leaf-grad)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
